name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anitrack_test
          POSTGRES_USER: anitrack
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anitrack -d anitrack_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://anitrack:ci-only-password@localhost:5432/anitrack_test
      DIRECT_URL: postgresql://anitrack:ci-only-password@localhost:5432/anitrack_test
      TEST_DATABASE_URL: postgresql://anitrack:ci-only-password@localhost:5432/anitrack_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
